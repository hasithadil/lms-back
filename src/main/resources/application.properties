# Database Connection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:1234}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lms-v3}

# Hibernate Auto-Create Tables
quarkus.hibernate-orm.database.generation=update

# Enable CORS for frontend
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,authorization
quarkus.http.cors.access-control-allow-credentials=true

# Keycloak OIDC Configuration
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:myrealm}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:quarkus-BE}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:change-me}
quarkus.oidc.tls.verification=${OIDC_TLS_VERIFICATION:none}

# Token issuer
quarkus.oidc.token.issuer=${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:myrealm}

# Keycloak Admin Client
keycloak.admin.server-url=${KEYCLOAK_URL:http://localhost:8081}
keycloak.admin.realm=${KEYCLOAK_REALM:myrealm}
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:1234}

# Default password assigned to newly created student/lecturer accounts
keycloak.default.password=${DEFAULT_USER_PASSWORD:1234}
